<form method="get" class="sidebar charge-filters">
<fieldset class="type_filter"><legend>Тип начисления</legend>
<label><input type="radio" name="type" value="" {% if not request.GET.type %}checked{% endif %}><span>Все</span></label>
{% for type in types %}<label><input type="radio" name="type" value="{{type.pk}}" {% if request.GET.type == type.pk|stringformat:'i' %}checked{% endif %}><span>{{type.name}}</span></label>{% endfor %}
</fieldset>
<div class="form_group status_filter"><label for="status-filter">Статус</label><select id="status-filter" name="status"><option value="">Все статусы</option><option value="0" {% if request.GET.status == '0' %}selected{% endif %}>Требуется оплата</option><option value="1" {% if request.GET.status == '1' %}selected{% endif %}>Оплачено</option></select></div>
<button class="primary_button filter_button" type="submit">Применить фильтры</button><a class="filter-reset" href="{{request.path}}">Сбросить</a>
</form>
